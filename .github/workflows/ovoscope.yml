name: Ovoscope End-to-End Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  ovoscope:
    uses: OpenVoiceOS/gh-automations/.github/workflows/ovoscope.yml@dev
    secrets: inherit
    with:
      runner: "ubuntu-latest"
      python_version: "3.11"
      install_extras: "test"
      test_path: "test/end2end/"
      # The cancel transformer fires before intent matching, so the
      # ovoscope cases here do not depend on any intent engine.
      bus_coverage: true
      bus_coverage_include: ""
      bus_coverage_exclude: "^Thread-|^intents$|^skills$|^__core__$"
      pr_comment: true
