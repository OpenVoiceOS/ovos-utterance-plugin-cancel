name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    with:
      python_version: '3.11'
      coverage_source: 'ovos_utterance_plugin_cancel'
      test_path: 'test/unittests'
      install_extras: '.[dev]'
      min_coverage: 0
