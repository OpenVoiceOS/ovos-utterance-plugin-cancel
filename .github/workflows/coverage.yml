name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@05c0bb438ca7d2bc485465bc233fd4e1997f23c5
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
    with:
      python_version: '3.11'
      coverage_source: 'ovos_utterance_plugin_cancel'
      test_path: 'test/'
      install_extras: ''
      min_coverage: 0
