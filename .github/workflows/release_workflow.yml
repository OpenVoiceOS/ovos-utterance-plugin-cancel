name: Release Alpha and Propose Stable

on:
  pull_request:
    types: [closed]
    branches: [dev]
  workflow_dispatch:

jobs:

  publish_alpha:
    uses: TigreGotico/gh-automations/.github/workflows/publish-alpha.yml@dev
    secrets: inherit
    with:
      branch: 'dev'
      version_file: 'ovos_utterance_plugin_cancel/version.py'
      setup_py: 'setup.py'
      update_changelog: true
      publish_prerelease: true
      changelog_max_issues: 100

  notify:
    if: github.event.pull_request.merged == true
    needs: publish_alpha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send message to Matrix bots channel
        uses: fadenb/matrix-chat-message@v0.0.6
        with:
          homeserver: 'matrix.org'
          token: ${{ secrets.MATRIX_TOKEN }}
          channel: '!WjxEKjjINpyBRPFgxl:krbel.duckdns.org'
          message: |
            new ${{ github.event.repository.name }} PR merged! https://github.com/${{ github.repository }}/pull/${{ github.event.number }}

  publish_pypi:
    needs: publish_alpha
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install build wheel
      - name: Build distribution packages
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  propose_release:
    needs: publish_alpha
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Get version
        id: get_version
        run: |
          VERSION=$(python -c 'import ovos_utterance_plugin_cancel.version as v; print(f"{v.VERSION_MAJOR}.{v.VERSION_MINOR}.{v.VERSION_BUILD}")')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Create and push release branch
        run: |
          git checkout -b release-${{ env.VERSION }}
          git push origin release-${{ env.VERSION }}
      - name: Open Pull Request from release branch to master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d "{\"title\":\"Release ${{ env.VERSION }}\",\"body\":\"Human review requested!\",\"head\":\"release-${{ env.VERSION }}\",\"base\":\"master\"}" \
            https://api.github.com/repos/${{ github.repository }}/pulls
