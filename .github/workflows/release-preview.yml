name: Release Preview

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  release_preview:
    uses: OpenVoiceOS/gh-automations/.github/workflows/release-preview.yml@05c0bb438ca7d2bc485465bc233fd4e1997f23c5
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
    with:
      package_name: 'ovos_utterance_plugin_cancel'
      version_file: 'ovos_utterance_plugin_cancel/version.py'
